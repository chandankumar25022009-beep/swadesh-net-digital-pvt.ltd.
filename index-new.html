<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नया भारत SecureNet इंडेक्स</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #8EC5FC, #E0C3FC 45%, #E0C3FC 100%);
            color: #222;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.12);
            padding: 34px;
            width: min(640px, 90%);
            text-align: center;
        }
        h1 {
            margin-bottom: 16px;
            color: #4B2C83;
        }
        p {
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .link-btn {
            background: #4B2C83;
            color: #fff;
            padding: 14px 24px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(75, 44, 131, 0.2);
        }
        .note {
            margin-top: 24px;
            color: #555;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>नया भारत SecureNet इंडेक्स</h1>
        <p>यह एक नया मुख्य पेज है जो आपके एप्लिकेशन के लिए दिखने वाला प्रारम्भिक इंटरफ़ेस है। आप इसे ब्राउज़र में खोल कर तुरंत देख सकते हैं।</p>
        <div class="links">
            <a class="link-btn" href="index.html">मौजूदा इंडेक्स देखें</a>
            <a class="link-btn" href="index-dark.html">डार्क थीम इंडेक्स</a>
            <a class="link-btn" href="index-light.html">लाइट थीम इंडेक्स</a>
        </div>
        <p class="note">अगर आप चाहें तो इसे मुख्य `index.html` बनने के लिए नाम बदल सकते हैं।</p>
    </div>
</body>
</html>
