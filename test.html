<!DOCTYPE html>
<html>
<head>
    <title>Test Bharat SecureNet</title>
</head>
<body>
    <h1>Testing Bharat SecureNet Application</h1>
    <div id="testResults"></div>

    <script>
        const results = document.getElementById('testResults');

        function log(message, success = true) {
            const div = document.createElement('div');
            div.style.color = success ? 'green' : 'red';
            div.style.margin = '10px 0';
            div.textContent = (success ? '✅ ' : '❌ ') + message;
            results.appendChild(div);
        }

        // Test 1: Check if localStorage is available
        try {
            localStorage.setItem('test', 'working');
            localStorage.removeItem('test');
            log('localStorage is working');
        } catch (e) {
            log('localStorage is not available', false);
        }

        // Test 2: Check if users array can be initialized
        try {
            let users = JSON.parse(localStorage.getItem('bharat_users') || '[]');
            log('Users array initialized: ' + users.length + ' users');
        } catch (e) {
            log('Users array initialization failed', false);
        }

        // Test 3: Check if emails array can be initialized
        try {
            let emails = JSON.parse(localStorage.getItem('bharat_emails') || '[]');
            log('Emails array initialized: ' + emails.length + ' emails');
        } catch (e) {
            log('Emails array initialization failed', false);
        }

        // Test 4: Check if messages array can be initialized
        try {
            let messages = JSON.parse(localStorage.getItem('bharat_messages') || '[]');
            log('Messages array initialized: ' + messages.length + ' messages');
        } catch (e) {
            log('Messages array initialization failed', false);
        }

        // Test 5: Check basic functions exist
        const functions = ['signup', 'login', 'logout', 'showMainApp', 'showAuthScreen'];
        functions.forEach(func => {
            if (typeof window[func] === 'function') {
                log('Function ' + func + ' exists');
            } else {
                log('Function ' + func + ' missing', false);
            }
        });

        log('Basic functionality test completed!');
    </script>
</body>
</html>
